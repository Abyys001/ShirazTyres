name: shiraztyres_driver
description: ShirazTyres technician app — offers, job status, and on-site invoicing.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # The picker's own file type. Used directly by the upload calls, which take an
  # XFile rather than a dart:io File so the same code compiles for the web.
  cross_file: ^0.3.4
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  # Declared, not borrowed: core/plain_store_web.dart reaches for
  # localStorage directly when the encrypted store cannot run.
  web: ^1.1.0
  geolocator: ^13.0.2
  go_router: ^14.6.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Headings and body use the platform's own UI sans, so only the mono face is
  # vendored (variable, instanced to these weights and subset to latin +
  # latin-ext). See docs/design-tokens.md.
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
