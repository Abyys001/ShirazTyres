<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1315">
  <meta name="description" content="ShirazTyres technician app — offers, job status, and on-site invoicing.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Driver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShirazTyres Driver</title>
  <!--
    `use-credentials`, because the panel serves these builds behind its own
    sign-in. A manifest is fetched anonymously by default, so the panel's
    middleware bounced it to /login and the browser reported the login page as a
    manifest syntax error.
  -->
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <style>
    :root { color-scheme: dark; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0B1315;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .stage {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    /* 390x844 is an iPhone 14/15 logical viewport — the size these layouts
       were designed against. The frame shrinks with a short window rather
       than overflowing it. */
    .phone {
      width: 390px;
      height: 844px;
      max-width: 100%;
      max-height: calc(100dvh - 88px);
      background: #FFFFFF;
      border: 10px solid #18211F;
      border-radius: 42px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 215, 0, .16);
      overflow: hidden;
    }

    #phone-screen { width: 100%; height: 100%; }

    .caption {
      margin: 0;
      font-size: 12px;
      letter-spacing: .04em;
      color: #7C8A8C;
    }

    /* A real handset, or a window narrow enough that the frame would be the
       only thing on screen: give the app everything. */
    @media (max-width: 520px), (max-height: 560px) {
      .stage { padding: 0; gap: 0; }
      .phone {
        width: 100%;
        height: 100dvh;
        max-height: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .caption { display: none; }
    }
  </style>
</head>
<body>
  <!--
    The apps are handset apps, and these builds are opened on a desktop from
    the panel's Apps page. Full-bleed, a sign-in form sits alone in the middle
    of a very wide window and says nothing about how the app actually looks, so
    the build is framed at phone size instead. Below 520px — a real phone, or a
    narrow window — the frame gets out of the way and the app fills the screen.

    `web/flutter_bootstrap.js` points Flutter's `hostElement` at #phone-screen.
  -->
  <div class="stage">
    <div class="phone">
      <div id="phone-screen"></div>
    </div>
    <p class="caption">Technician app — browser preview at phone size</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
