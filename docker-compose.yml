services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiraztyres}
      POSTGRES_USER: ${POSTGRES_USER:-shiraztyres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiraztyres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiraztyres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # 5433 by default so a Postgres already running on the host still works.
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    entrypoint: ["/app/entrypoint.sh"]
    # Daphne, not runserver: the panel map, the customer ETA feed and the driver
    # offer stream are all WebSocket, and WSGI cannot carry them.
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      # Overridable so the stack can co-exist with anything already on :8000.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ./backend:/app
      - media_files:/app/media
    depends_on:
      - backend
      - redis

  beat:
    build: ./backend
    env_file: .env
    # Dispatch timeouts, document expiry and location retention all run from here.
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Server-side calls stay inside the compose network; the browser never
      # talks to the API directly (it goes through the panel's proxy route).
      API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000/api/v1}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000/ws}
      # Where the panel's Apps page sends you for the customer site. It is the
      # published port, not the compose one — the link opens in your browser.
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:3001}
      # Without these the map draws pins on an empty background — section 10.1.
      NEXT_PUBLIC_MAP_TILE_URL: ${MAP_TILE_URL:-}
      NEXT_PUBLIC_MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}
    volumes:
      - ./panel:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${PANEL_HOST_PORT:-3000}:3000"
    command: ["npm", "run", "dev"]
    depends_on:
      - backend

  website:
    # The customer-facing site — phase 2. Separate from the panel so it can be
    # deployed, scaled and cached on its own.
    build:
      context: ./website
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000/api/v1}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000/ws}
      NEXT_PUBLIC_MAP_TILE_URL: ${MAP_TILE_URL:-}
      NEXT_PUBLIC_MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_WEB_CLIENT_ID:-}
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${WEBSITE_HOST_PORT:-3001}:3000"
    command: ["npm", "run", "dev"]
    depends_on:
      - backend

volumes:
  postgres_data:
  static_files:
  media_files:
