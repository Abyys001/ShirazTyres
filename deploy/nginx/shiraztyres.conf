# ShirazTyres behind nginx, reached by bare IP.
#
# Symlinked into /etc/nginx/sites-enabled/ on the host. Kept here so the thing
# actually serving the stack is in the repository rather than only on one box.
#
# ---------------------------------------------------------------------------
# Why this exists
#
# The compose stack publishes the panel on 3100, the API on 8100 and the
# customer site on 3101. That is fine on a workbench and a liability on the open
# internet: a non-standard port over plain http is among the first things an
# intermediary throttles or drops, and it fails in the worst possible way. The
# HTML is small and arrives; the JavaScript is not and does not. What is left on
# screen is the server-rendered markup — which is every list in its "Loading…"
# state — so the panel reads as one that has lost its API, and nothing appears
# in any log, because the browser never ran the code that makes the requests.
#
# Putting the panel and the API on one origin on the standard port removes that,
# and two other classes of problem with it: there is no CORS between the panel
# and the API any more, and the WebSocket is same-origin rather than a second
# port that has to be reachable on its own.
#
# ---------------------------------------------------------------------------
# What it does not do
#
# `server_name` is this IP and nothing else, so the ~15 unrelated vhosts on this
# machine keep matching on their own names and are untouched. The one exception
# is `default_server` on 443, which is unavoidable: a browser opening
# https://<an IP> sends no SNI, so nginx has no name to select a certificate by
# and falls back to the default server for that port. Nothing else claimed it.

upstream shiraztyres_panel   { server 127.0.0.1:3100; keepalive 16; }
upstream shiraztyres_backend { server 127.0.0.1:8100; keepalive 16; }

# The certificate is self-signed, because Let's Encrypt refuses to issue for a
# bare IP address. It carries the IP in subjectAltName, which is what a browser
# checks; it encrypts the traffic but cannot authenticate it, so every browser
# shows a warning on first visit. Point a hostname at this box and this becomes
# a one-line swap for a real certificate — see deploy/README.md.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 159.195.199.91;

    # Certbot renews through here. Left in place for the day a real hostname
    # points at this box: issuance and every renewal after it need this path.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 159.195.199.91;

    ssl_certificate     /etc/ssl/shiraztyres/ip.crt;
    ssl_certificate_key /etc/ssl/shiraztyres/ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ShirazTyresTLS:10m;
    ssl_session_timeout 1d;

    # Deliberately no HSTS. The certificate is self-signed, so pinning this
    # browser to https for a year would turn one clickable warning into a site
    # that cannot be opened at all if the certificate is ever replaced.

    # Driver photographs and uploaded documents run to a few megabytes.
    client_max_body_size 25m;

    # Compressing the panel's JavaScript is most of the point of this file.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # ------------------------------------------------------------- API ----
    # Django owns these prefixes; the panel owns /api/auth/* and /api/proxy/*,
    # so the two do not collide. /media/ matters more than it looks: document
    # and photograph URLs come back from the API as site-relative paths, so on
    # a split origin the panel linked to files it could not reach.
    location ~ ^/(api/v1|api/docs|api/schema|admin|static|media)/ {
        proxy_pass http://shiraztyres_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------- the live channel ----
    # An offer expires in sixty seconds, so this connection is the difference
    # between a technician being told and a technician finding out. It is idle
    # for minutes between events — both apps and the panel ping inside it — so
    # the read timeout is long on purpose.
    location /ws/ {
        proxy_pass http://shiraztyres_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ----------------------------------------------------------- panel ----
    location / {
        proxy_pass http://shiraztyres_panel;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
