# The routing ShirazTyres needs, shared by the http and https server blocks.
#
# Included twice on purpose. Port 80 does not redirect to 443, because the
# certificate on 443 is self-signed: a browser meets a full-page warning there,
# and some of them — anything with HTTPS-only mode on — will not offer a way
# through it at all. Redirecting would mean the only route in is one that can
# be refused by the client, which is how "I cannot reach the panel" happens on a
# server that is up and serving.
#
# So both ports serve the same thing. 443 is the one to use and the one the apps
# are built against; 80 is the one that always works. When a real certificate
# replaces the self-signed one, turn 80 back into a redirect — at that point it
# costs nothing.

# Driver photographs and uploaded documents run to a few megabytes.
client_max_body_size 25m;

# Compressing the panel's JavaScript is most of the point of this file.
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json
           application/wasm image/svg+xml application/manifest+json;

# Certbot renews through here. Left in place for the day a real hostname points
# at this box: issuance and every renewal after it need this path.
location /.well-known/acme-challenge/ {
    root /var/www/acme;
}

# ----------------------------------------------------------------- API ----
# Django owns these prefixes; the panel owns /api/auth/* and /api/proxy/*, so
# the two do not collide. /media/ matters more than it looks: document and
# photograph URLs come back from the API as site-relative paths, so on a split
# origin the panel linked to files it could not reach.
location ~ ^/(api/v1|api/docs|api/schema|admin|static|media)/ {
    proxy_pass http://shiraztyres_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
}

# ------------------------------------------------------ the live channel ----
# An offer expires in sixty seconds, so this connection is the difference
# between a technician being told and a technician finding out. It is idle for
# minutes between events — both apps and the panel ping inside it — so the read
# timeout is long on purpose.
location /ws/ {
    proxy_pass http://shiraztyres_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# --------------------------------------------------------------- panel ----
location / {
    proxy_pass http://shiraztyres_panel;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
}
