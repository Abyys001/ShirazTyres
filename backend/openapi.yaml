components:
  schemas:
    ActorTypeEnum:
      enum:
      - customer
      - driver
      - staff
      - system
      type: string
      description: |-
        * `customer` - Customer
        * `driver` - Driver
        * `staff` - Staff
        * `system` - System
    AddLine:
      type: object
      properties:
        service_item_id:
          type: integer
          nullable: true
        description:
          type: string
          maxLength: 200
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          default: '1.00'
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: part
    AttachPhone:
      type: object
      properties:
        phone:
          type: string
          maxLength: 32
        code:
          type: string
          maxLength: 12
      required:
      - code
      - phone
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        category_display:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/AuditEventSeverityEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        actor:
          type: string
          readOnly: true
        subject_type:
          type: string
          readOnly: true
        subject_id:
          type: string
          readOnly: true
        payload:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - category
      - category_display
      - created_at
      - id
      - message
      - payload
      - severity
      - subject_id
      - subject_type
    AuditEventSeverityEnum:
      enum:
      - debug
      - info
      - warning
      - error
      type: string
      description: |-
        * `debug` - Debug
        * `info` - Info
        * `warning` - Warning
        * `error` - Error
    BlankEnum:
      enum:
      - ''
    Cancel:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    CandidatePreview:
      type: object
      description: The panel's 'who would get this?' view, without actually dispatching.
      properties:
        driver_id:
          type: integer
        name:
          type: string
        phone:
          type: string
        eta_seconds:
          type: integer
        eta_minutes:
          type: integer
        distance_metres:
          type: integer
      required:
      - distance_metres
      - driver_id
      - eta_minutes
      - eta_seconds
      - name
      - phone
    CategoryEnum:
      enum:
      - auth
      - sms
      - email
      - push
      - job
      - dispatch
      - billing
      - stripe
      - settings
      - driver
      - staff
      - system
      type: string
      description: |-
        * `auth` - Sign-in and OTP
        * `sms` - SMS
        * `email` - Email
        * `push` - Push notification
        * `job` - Job
        * `dispatch` - Dispatch
        * `billing` - Billing
        * `stripe` - Stripe
        * `settings` - Settings
        * `driver` - Driver
        * `staff` - Staff
        * `system` - System
    ChannelEnum:
      enum:
      - sms
      - email
      - push
      type: string
      description: |-
        * `sms` - SMS
        * `email` - Email
        * `push` - Push
    ConfirmationPathEnum:
      enum:
      - confirmed
      - overridden
      type: string
      description: |-
        * `confirmed` - Path A — customer confirmed the looked-up specification
        * `overridden` - Path B — customer supplied their own specification
    CoverageCheck:
      type: object
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      required:
      - latitude
      - longitude
    CoverageResult:
      type: object
      properties:
        covered:
          type: boolean
        area:
          type: string
          nullable: true
        message:
          type: string
      required:
      - area
      - covered
      - message
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          nullable: true
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        photo_url:
          type: string
          format: uri
          readOnly: true
        is_phone_verified:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
        notes:
          type: string
          description: Internal notes, visible to staff only.
        vehicle_count:
          type: integer
          readOnly: true
          default: 0
        job_count:
          type: integer
          readOnly: true
          default: 0
        identities:
          type: array
          items:
            $ref: '#/components/schemas/SocialIdentity'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - identities
      - is_email_verified
      - is_phone_verified
      - job_count
      - last_login_at
      - photo_url
      - updated_at
      - vehicle_count
    CustomerJob:
      type: object
      description: |-
        Section 4.6 and 4.7, enforced by omission.

        The customer gets status, an ETA figure, and the driver's first name, photo and van.
        No coordinates for the driver, no phone number, no internal notes, no dispatch history.
      properties:
