          type: string
          maxLength: 120
        contact_phone:
          type: string
          maxLength: 20
        contact_email:
          type: string
          format: email
          maxLength: 254
        issue_type:
          type: string
          description: A value from the configured issue list.
          maxLength: 32
        description:
          type: string
        tyre_size:
          type: string
          description: The figure the van is loaded from.
          maxLength: 32
        location_text:
          type: string
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        internal_notes:
          type: string
        damaged_positions:
          type: array
          items:
            $ref: '#/components/schemas/DamagedTyre'
          maxItems: 5
    PatchedJobStatusUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        note:
          type: string
          maxLength: 255
        assigned_staff_id:
          type: integer
          nullable: true
        force:
          type: boolean
          default: false
          description: Move the job regardless of the section 5 lifecycle. Requires
            a reason.
    PatchedServiceArea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        boundary:
          description: GeoJSON Polygon or MultiPolygon, [longitude, latitude] order.
        centre:
          readOnly: true
        is_active:
          type: boolean
        priority:
          type: integer
          maximum: 32767
          minimum: -32768
          description: Higher wins where areas overlap.
        dispatch_overrides:
          description: Setting keys from the dispatch group that differ inside this
            area.
        notes:
          type: string
        driver_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedServiceItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/KindEnum'
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit:
          type: string
          description: each, hour, litre…
          maxLength: 24
        is_active:
          type: boolean
        sort_order:
          type: integer
          maximum: 32767
          minimum: -32768
    PatchedSettingsUpdate:
      type: object
      properties:
        values:
          type: object
          additionalProperties: {}
    PatchedStaffUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
    Payment:
      type: object
      properties:
        payment_method:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          - $ref: '#/components/schemas/BlankEnum'
        payment_reference:
          type: string
          maxLength: 128
    PaymentMethodEnum:
      enum:
      - unspecified
      - card_reader
      - payment_link
      - cash
      - other
      type: string
      description: |-
        * `unspecified` - Not recorded
        * `card_reader` - Card reader in the van
        * `payment_link` - Payment link by SMS
        * `cash` - Cash
        * `other` - Other
    PlatformEnum:
      enum:
      - android
      - ios
      - web
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
        * `web` - Web
    PositionEnum:
      enum:
      - front_left
      - front_right
      - rear_left
      - rear_right
      - spare
      type: string
      description: |-
        * `front_left` - Nearside front
        * `front_right` - Offside front
        * `rear_left` - Nearside rear
        * `rear_right` - Offside rear
        * `spare` - Spare
    ProviderEnum:
      enum:
      - google
      type: string
      description: '* `google` - Google'
    PurposeEnum:
      enum:
      - login
      - job
      - driver
      type: string
      description: |-
        * `login` - Login or registration
        * `job` - Confirm emergency request
        * `driver` - Driver sign-in
    Refresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Refund:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Leave empty to refund the whole invoice.
        reason:
          type: string
          maxLength: 255
    Reject:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    RoleEnum:
      enum:
      - owner
      - shop_owner
      - staff
      type: string
      description: |-
        * `owner` - Owner
        * `shop_owner` - Shop owner
        * `staff` - Office
    ServiceArea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        boundary:
          description: GeoJSON Polygon or MultiPolygon, [longitude, latitude] order.
        centre:
          readOnly: true
        is_active:
          type: boolean
        priority:
          type: integer
          maximum: 32767
          minimum: -32768
          description: Higher wins where areas overlap.
        dispatch_overrides:
          description: Setting keys from the dispatch group that differ inside this
            area.
        notes:
          type: string
        driver_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - boundary
      - centre
      - created_at
      - driver_count
      - id
      - name
      - updated_at
    ServiceItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/KindEnum'
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit:
          type: string
          description: each, hour, litre…
          maxLength: 24
        is_active:
          type: boolean
        sort_order:
          type: integer
          maximum: 32767
          minimum: -32768
      required:
      - code
      - id
      - name
      - unit_price
    SettingSpec:
      type: object
      properties:
        key:
          type: string
        group:
          type: string
        type:
          type: string
        label:
          type: string
        help_text:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: {}
        default: {}
        value: {}
      required:
      - default
      - group
      - help_text
      - key
      - label
      - type
      - value
    SettingsDocument:
      type: object
      description: One payload the panel can render a whole settings screen from.
      properties:
        values:
          type: object
          additionalProperties: {}
        specs:
          type: array
          items:
            $ref: '#/components/schemas/SettingSpec'
      required:
      - specs
      - values
    SocialIdentity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - email
      - id
      - last_used_at
      - provider
    SourceEnum:
      enum:
      - website
      - app
      - panel
      - phone
      type: string
      description: |-
        * `website` - Customer website
        * `app` - Customer app
        * `panel` - Owner panel
        * `phone` - Phone call
    StaffCreate:
      type: object
      description: |-
        Create a panel account.

        The password is write-only and validated through Django's own validators, so
        the rules the project already configures apply here rather than a second set
        invented for the panel.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
      required:
      - email
      - id
      - name
      - password
    StaffLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    StaffTyreOverride:
      type: object
      properties:
        tyre_size:
          type: string
          maxLength: 32
      required:
      - tyre_size
    StaffUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
      required:
      - email
      - name
    StaffUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - name
    StateEnum:
      enum:
      - offered
      - accepted
      - rejected
      - withdrawn
      - timed_out
      type: string
      description: |-
        * `offered` - Offered
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn — taken by another driver
        * `timed_out` - No response
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TyreConfirmation:
      type: object
      description: The section 4.3 decision, in the shape both customer surfaces post
        it.
      properties:
        confirmation_path:
          $ref: '#/components/schemas/ConfirmationPathEnum'
        tyre_size:
          type: string
          maxLength: 32
        load_index:
          type: string
          maxLength: 16
        speed_rating:
          type: string
          maxLength: 8
        disclaimer_accepted:
          type: boolean
          default: false
      required:
      - confirmation_path
    TyreConfirmationInput:
      type: object
      properties:
        confirmation_path:
          $ref: '#/components/schemas/ConfirmationPathEnum'
        tyre_size:
          type: string
          maxLength: 32
        load_index:
          type: string
          maxLength: 16
        speed_rating:
          type: string
          maxLength: 8
        disclaimer_accepted:
          type: boolean
          default: false
      required:
      - confirmation_path
    TyreCorrection:
      type: object
      properties:
        tyre_size:
          type: string
          maxLength: 32
        note:
          type: string
          maxLength: 255
      required:
      - tyre_size
    TyreSourceEnum:
      enum:
      - api
      - customer
      - staff
      - driver
      - unknown
      type: string
      description: |-
        * `api` - Tyre data API
        * `customer` - Confirmed by customer
        * `staff` - Entered by staff
        * `driver` - Corrected by driver on site
        * `unknown` - Unknown
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plate:
          type: string
          maxLength: 16
        display_plate:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        make:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        colour:
          type: string
          readOnly: true
        fuel_type:
          type: string
          readOnly: true
        engine_capacity:
          type: integer
          readOnly: true
          nullable: true
          description: cc
        year_of_manufacture:
          type: integer
          readOnly: true
          nullable: true
        co2_emissions:
          type: integer
          readOnly: true
          nullable: true
        tax_status:
          type: string
          readOnly: true
        tax_due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        mot_status:
          type: string
          readOnly: true
        mot_expiry_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        tyre_size_front:
          type: string
          readOnly: true
          description: e.g. 205/55R16
        tyre_size_rear:
          type: string
          readOnly: true
        tyre_load_index:
          type: string
          readOnly: true
        tyre_speed_rating:
          type: string
          readOnly: true
        tyre_pressure_front_psi:
          type: integer
          readOnly: true
          nullable: true
        tyre_pressure_rear_psi:
          type: integer
          readOnly: true
          nullable: true
        tyre_size_options:
          readOnly: true
          description: Alternative fitments when the trim is ambiguous.
        tyre_source:
          allOf:
          - $ref: '#/components/schemas/TyreSourceEnum'
          readOnly: true
        has_tyre_data:
          type: boolean
          readOnly: true
        is_fitment_ambiguous:
          type: boolean
          readOnly: true
        dvla_fetched_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        tyre_fetched_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        lookup_error:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - co2_emissions
      - colour
      - description
      - display_plate
      - dvla_fetched_at
      - engine_capacity
      - fuel_type
      - has_tyre_data
      - id
      - is_fitment_ambiguous
      - lookup_error
      - make
      - model
      - mot_expiry_date
      - mot_status
      - plate
      - tax_due_date
      - tax_status
      - tyre_fetched_at
      - tyre_load_index
      - tyre_pressure_front_psi
      - tyre_pressure_rear_psi
      - tyre_size_front
      - tyre_size_options
      - tyre_size_rear
      - tyre_source
      - tyre_speed_rating
      - updated_at
      - year_of_manufacture
    VerificationStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - suspended
      type: string
      description: |-
        * `pending` - Pending review
        * `approved` - Approved
        * `rejected` - Rejected
        * `suspended` - Suspended
    VerificationUpdate:
      type: object
      properties:
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
        note:
          type: string
          maxLength: 255
      required:
      - verification_status
  securitySchemes:
    customerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued for the customer audience.
    driverJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued for the driver audience.
    staffJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued for the staff audience.
