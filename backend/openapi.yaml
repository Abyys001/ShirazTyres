        a shell.
      parameters:
      - in: query
        name: booking
        schema:
          type: integer
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - email
          - push
          - sms
        description: |-
          * `sms` - SMS
          * `email` - Email
          * `push` - Push
