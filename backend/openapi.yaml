  /api/v1/bookings:
    get:
      operationId: bookings_list
      description: 'The panel''s main surface: list, detail, manual creation, status
        changes.'
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: integer
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: issue_type
        schema:
          type: string
          enum:
          - blowout
          - other
          - puncture
          - tyre_damage
          - wheel_change
        description: |-
          * `puncture` - Puncture
          * `blowout` - Blowout
          * `tyre_damage` - Tyre damage
          * `wheel_change` - Wheel change
          * `other` - Other
      - in: query
        name: open_only
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - app
          - panel
          - phone
          - website
        description: |-
          * `website` - Website
          * `app` - Mobile app
          * `panel` - Admin panel
          * `phone` - Phone call
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - assigned
            - cancelled
            - completed
            - in_progress
            - received
        description: |-
          * `received` - Received
          * `assigned` - Assigned
          * `in_progress` - In progress
          * `completed` - Completed
          * `cancelled` - Cancelled
        explode: true
        style: form
      tags:
      - bookings
      security:
      - staffJWT: []
      - driverJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: 'The panel''s main surface: list, detail, manual creation, status
        changes.'
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - staffJWT: []
      - driverJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/v1/bookings/{id}:
